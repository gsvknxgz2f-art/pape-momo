<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Présentation - Pape Ibrahima Sarr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="photo-section">
            <div class="placeholder-photo">
            <img src="./IMAGE/IMAGE.jpeg" alt="pape ibrahima sarr">
            </div>
        </div>
        
        <div class="info-section">
            <div class="nom-complet">
                <div class="prenom">Pape Ibrahima</div>
                <div class="nom">SARR</div>
            </div>
            
            <div class="domaine">
                <div class="etudiant">Étudiant en</div>
                <div class="specialite">Génie Logiciel et</div>
                <div class="specialite">Administration Réseau</div>
            </div>
        </div>

        <div class="form-section">
            <h3>Contactez-moi</h3>
            <form id="contactForm" action="#" method="post">
                <div class="form-group">
                    <label for="nom">Nom complet</label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="telephone">Téléphone</label>
                    <input type="tel" id="telephone" name="telephone">
                </div>

                <div class="form-group">
                    <label for="sujet">Sujet</label>
                    <select id="sujet" name="sujet" required>
                        <option value="">Choisissez un sujet</option>
                        <option value="collaboration">Proposition de collaboration</option>
                        <option value="stage">Offre de stage</option>
                        <option value="projet">Discussion de projet</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Vous êtes :</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="etudiant" name="profil" value="etudiant">
                            <label for="etudiant">Étudiant</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="professionnel" name="profil" value="professionnel">
                            <label for="professionnel">Professionnel</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="autre" name="profil" value="autre">
                            <label for="autre">Autre</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Votre message..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Envoyer le message</button>
            </form>
            <div id="message" class="message"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
