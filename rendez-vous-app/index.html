<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application de Rendez-vous</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Planificateur de Rendez-vous</h1>
            <p>Gérez vos rendez-vous facilement</p>
        </header>

        <form id="appointmentForm">
            <h2>Ajouter un Rendez-vous</h2>
            <div class="form-group">
                <label for="title">Titre du rendez-vous</label>
                <input type="text" id="title" name="title" placeholder="Ex: Réunion avec client" required>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="time">Heure</label>
                <input type="time" id="time" name="time" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Détails du rendez-vous..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Ajouter le Rendez-vous</button>
        </form>

        <div class="appointments-section">
            <h2>Mes Rendez-vous</h2>
            <div id="appointmentsList"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
